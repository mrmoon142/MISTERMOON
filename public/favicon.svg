<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1322" />
      <stop offset="100%" stop-color="#05070C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#D4AF37" stroke-width="8" stroke-opacity="0.5"/>
  <!-- Crescent Moon & Star Orbit Accent -->
  <path d="M 330 160 A 120 120 0 1 1 200 370 A 100 100 0 0 0 330 160 Z" fill="url(#goldGrad)" opacity="0.3" />
  <!-- MM Futuristic Monogram -->
  <text x="256" y="325" font-family="'Cinzel', 'Outfit', sans-serif" font-weight="900" font-size="200" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="-8">MM</text>
  <circle cx="390" cy="140" r="14" fill="#FCE082" filter="url(#glow)" />
</svg>
